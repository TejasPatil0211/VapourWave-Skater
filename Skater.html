<!DOCTYPE html>
<!-- VAPORWAVE SKATER — Endless runner pivot from racing -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vaporwave Skater</title>
<style>
  html, body { margin: 0; height: 100%; background: #06030f; overflow: hidden; }
  #gl  { display: block; width: 100vw; height: 100vh; }
  #hud { position: fixed; top: 14px; left: 14px; pointer-events: none; z-index: 50; }
  #ui {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    z-index: 100; display: flex; align-items: center; justify-content: center;
    font-family: 'Courier New', monospace; color: #fff;
    pointer-events: none;
    background: radial-gradient(circle at 50% 40%, rgba(20,5,40,0.55), rgba(4,2,12,0.92));
  }
  #ui:not(.active) { display: none; }
  #ui.active { pointer-events: auto; }
  .screen { display: none; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 2rem; width: 100%; height: 100%; }
  .screen.active { display: flex; }
  .title {
    font-size: clamp(2.5rem, 7vw, 5rem); font-weight: 900; letter-spacing: 0.1em; margin: 0 0 1rem 0;
    background: linear-gradient(90deg, #ff00aa, #00f0ff, #ffaa00);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    text-shadow: 0 0 30px rgba(255, 0, 170, 0.5);
  }
  .subtitle { font-size: 1.2rem; color: #00f0ff; letter-spacing: 0.3em; text-shadow: 0 0 10px rgba(0, 240, 255, 0.6); margin: 0.5rem 0 1.5rem 0; }
  .big-btn {
    font-size: 1.5rem; font-weight: 900; letter-spacing: 0.2em; padding: 1rem 3rem; margin: 0.5rem;
    background: linear-gradient(135deg, #ff00aa, #00f0ff); color: #000; border: none; border-radius: 4px;
    cursor: pointer; font-family: inherit; text-transform: uppercase;
    box-shadow: 0 0 20px rgba(255, 0, 170, 0.5);
  }
  .big-btn:hover { filter: brightness(1.15); }
  .footer { position: absolute; bottom: 1rem; font-size: 0.8rem; color: #888; }
  .footer-2 { bottom: 2.5rem; }
  #banner { position: fixed; left: 0; right: 0; top: 20%; z-index: 60; pointer-events: none; text-align: center;
    font-family: 'Courier New', monospace; opacity: 0; }
  #banner .b-lv  { font-size: clamp(2.2rem, 7vw, 4.5rem); font-weight: 900; letter-spacing: 0.25em; color: #fff;
    text-shadow: 0 0 24px #ff00aa, 0 0 48px #00f0ff; }
  #banner .b-msg { font-size: clamp(1rem, 2.4vw, 1.6rem); letter-spacing: 0.4em; color: #ff6677;
    text-shadow: 0 0 12px #ff2a3a; margin-top: 0.4rem; }
  #banner.show { animation: bannerPop 2.4s ease-out forwards; }
  @keyframes bannerPop {
    0%   { opacity: 0; transform: scale(1.3); }
    12%  { opacity: 1; transform: scale(1.0); }
    75%  { opacity: 1; }
    100% { opacity: 0; }
  }
  #warn { position: fixed; left: 0; right: 0; bottom: 8%; z-index: 60; pointer-events: none; text-align: center;
    font-family: 'Courier New', monospace; font-weight: 900; letter-spacing: 0.35em;
    font-size: clamp(1rem, 2.6vw, 1.8rem); color: #ff3344; text-shadow: 0 0 14px #ff0022; opacity: 0; }
  #warn.on { animation: warnBlink 0.6s ease-in-out infinite; }
  @keyframes warnBlink { 0%, 100% { opacity: 0.25; } 50% { opacity: 1; } }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<canvas id="hud" width="260" height="142"></canvas>
<div id="banner"><div class="b-lv"></div><div class="b-msg"></div></div>
<div id="warn">IT'S RIGHT BEHIND YOU</div>

<div id="ui" class="active">
  <div id="screen-menu" class="screen active">
    <h1 class="title">VAPORWAVE SKATER</h1>
    <p class="subtitle">ENDLESS RUNNER</p>
    <button id="btn-play" class="big-btn">▶ PLAY</button>
    <p class="footer footer-2">A/D or ←→ to switch lanes · W or ↑ to jump · S or ↓ to slide</p>
    <p class="footer">Something is chasing you. Clean running and coins push it back · M = mute</p>
  </div>

  <div id="screen-playing" class="screen"></div>

  <div id="screen-gameover" class="screen">
    <h1 class="title">CAUGHT</h1>
    <p id="final-dist" class="subtitle"></p>
    <p id="final-score" class="subtitle"></p>
    <button id="btn-restart" class="big-btn">↻ PLAY AGAIN</button>
    <p class="footer">Press R to restart</p>
  </div>
</div>

<script>
/* ------------------------------------------------------------------ */
/* Shaders                                                             */
/* ------------------------------------------------------------------ */
const VERT = `#version 300 es
void main() {
  vec2 v[3] = vec2[3](vec2(-1.0, -1.0), vec2(3.0, -1.0), vec2(-1.0, 3.0));
  gl_Position = vec4(v[gl_VertexID], 0.0, 1.0);
}`;

const FRAG = `#version 300 es
precision highp float;

uniform vec3  iResolution;
uniform float iTime;
uniform float uSeed;
uniform float uSpeed;
uniform float uDistance;
uniform vec2  uShake;
uniform vec3  uSkater;        // x = lane (-1..1), y = jumpHeight, z = sliding (0/1)
uniform float uPop;           // 1 right after a coin pickup, fades to 0
uniform float uThreat;        // 0 = far behind you ... 1 = it has you
uniform float uHurt;          // red flash after a stumble
uniform float uBlink;         // 1 while the skater is invulnerable (blinks)
uniform float uBeat;          // heartbeat pulse 0..1
uniform float uDark;          // how deep into the run you are (0..1): the world drains and darkens
uniform int   uObstacleCount;
uniform vec4  uObstacles[16]; // x = lane, y = dist, z = type (0=low, 1=high), w = alive
uniform int   uCoinCount;
uniform vec4  uCoins[32];     // x = lane, y = dist, z = height (0 ground, 1 raised), w = spin phase

out vec4 fragColor;

const float PI           = 3.14159265359;
const float SKATER_S     = 0.055;
const vec2  KART_POS     = vec2(0.0, -0.25);
const float HORIZON_Y    = 0.20;
const float COMPRESSION  = 0.25;
const float HORIZON_VIS  = 0.164;
const float LANE_X       = 0.30;

const vec3 PAL[30] = vec3[30](
  vec3(0.02, 0.01, 0.10), vec3(0.35, 0.05, 0.40), vec3(0.10, 0.95, 1.00), vec3(0.08, 0.10, 0.25), vec3(1.00, 0.82, 0.30),
  vec3(0.55, 0.95, 0.92), vec3(0.85, 1.00, 0.95), vec3(0.06, 0.30, 0.25), vec3(0.35, 0.65, 0.55), vec3(1.00, 0.35, 0.55),
  vec3(0.15, 0.02, 0.02), vec3(0.85, 0.20, 0.05), vec3(0.70, 0.12, 0.10), vec3(0.35, 0.15, 0.10), vec3(1.00, 0.90, 0.20),
  vec3(0.05, 0.20, 0.45), vec3(0.75, 0.92, 1.00), vec3(0.90, 0.98, 1.00), vec3(0.45, 0.65, 0.85), vec3(1.00, 0.45, 0.05),
  vec3(0.20, 0.05, 0.35), vec3(1.00, 0.45, 0.20), vec3(0.35, 0.10, 0.45), vec3(0.20, 0.08, 0.25), vec3(0.30, 1.00, 0.95),
  vec3(0.02, 0.10, 0.02), vec3(0.15, 0.55, 0.10), vec3(0.08, 0.30, 0.10), vec3(0.05, 0.18, 0.05), vec3(0.85, 1.00, 0.10)
);

float hash11(float n) {
  n = fract(n * 0.1031);
  n *= n + 33.33;
  n *= n + n;
  return fract(n);
}

float distToSegment(vec2 p, vec2 a, vec2 b) {
  vec2 pa = p - a, ba = b - a;
  float h = clamp(dot(pa, ba) / max(dot(ba, ba), 1e-6), 0.0, 1.0);
  return length(pa - ba * h);
}

float sdTriangle(vec2 p, vec2 p0, vec2 p1, vec2 p2) {
  vec2 e0 = p1 - p0, e1 = p2 - p1, e2 = p0 - p2;
  vec2 v0 = p - p0, v1 = p - p1, v2 = p - p2;
  vec2 q0 = v0 - e0 * clamp(dot(v0, e0) / dot(e0, e0), 0.0, 1.0);
  vec2 q1 = v1 - e1 * clamp(dot(v1, e1) / dot(e1, e1), 0.0, 1.0);
  vec2 q2 = v2 - e2 * clamp(dot(v2, e2) / dot(e2, e2), 0.0, 1.0);
  float s = sign(e0.x * e2.y - e0.y * e2.x);
  vec2  d = min(min(vec2(dot(q0, q0), s * (v0.x * e0.y - v0.y * e0.x)),
                    vec2(dot(q1, q1), s * (v1.x * e1.y - v1.y * e1.x))),
                    vec2(dot(q2, q2), s * (v2.x * e2.y - v2.y * e2.x)));
  return -sqrt(d.x) * sign(d.y);
}

float sdBox(vec2 p, vec2 b) {
  vec2 d = abs(p) - b;
  return length(max(d, 0.0)) + min(max(d.x, d.y), 0.0);
}

vec2 rot2(vec2 v, float a) {
  float c = cos(a), s = sin(a);
  return vec2(c * v.x - s * v.y, s * v.x + c * v.y);
}

vec3 applyShadow(vec3 col, vec2 p, vec2 groundPoint, float radius) {
  vec2  shSize = vec2(radius * 2.0, radius * 0.9);
  float dSh    = length((p - groundPoint) / shSize);
  float shA    = 0.55 * (1.0 - smoothstep(0.0, 1.2, dSh));
  return mix(col, vec3(0.0), shA);
}

vec3 voidColor(vec2 wp, float time, int tid, vec3 offC, vec3 trackC, vec3 accent) {
  if (tid == 0) {
    vec2  grid     = abs(fract(wp * 8.0) - 0.5);
    float line     = min(grid.x, grid.y);
    float gridMask = 1.0 - smoothstep(0.0, 0.05, line);
    return mix(offC, trackC, gridMask);
  } else if (tid == 1) {
    /* Minty: a soft, low-contrast drift instead of hard white streaks */
    float drift = 0.5 + 0.5 * sin(wp.y * 0.6 - time * 0.5 + sin(wp.x * 1.2) * 1.2);
    return mix(offC * 0.92, offC + (vec3(1.0) - offC) * 0.10, drift);
  } else if (tid == 2) {
    /* Lava: smooth, slow heat shimmer instead of random squares */
    float heat = 0.5 + 0.5 * sin(wp.y * 0.9 + time * 0.8 + sin(wp.x * 1.3) * 1.5);
    return mix(offC, offC + accent * 0.16, heat);
  } else if (tid == 3) {
    /* Ice: a gentle sheen instead of random sparkle cells */
    float sheen = 0.5 + 0.5 * sin(wp.x * 1.1 + wp.y * 0.7 + time * 0.4);
    return mix(offC * 0.88, offC * 1.04, sheen);
  } else if (tid == 4) {
    float d1   = sin(wp.x * 4.0 + time * 0.3) * 0.5 + 0.5;
    float d2   = sin(wp.y * 3.0 - time * 0.5 + wp.x * 2.0) * 0.5 + 0.5;
    float dust = mix(d1, d2, 0.5);
    return mix(offC, accent, dust * 0.65);
  } else {
    /* Toxic: slow, soft glow drifting past instead of random bubble squares */
    float glow = 0.5 + 0.5 * sin(wp.y * 0.8 - time * 0.9 + sin(wp.x * 1.6) * 1.2);
    return mix(offC, offC + accent * 0.14, glow);
  }
}

vec3 addScenery(vec3 col, vec2 p, float time, int tid, float seed, vec3 accent, float camYaw) {
  if (p.y < HORIZON_VIS - 0.02) return col;
  for (int i = 0; i < 24; i++) {
    float fi   = float(i);
    float li   = floor(fi / 8.0);
    float hs1  = hash11(seed * 3.1 + fi * 7.7);
    float hs2  = hash11(seed * 5.3 + fi * 11.1);
    float hs3  = hash11(seed * 9.1 + fi * 13.3);
    float scroll = camYaw * (0.12 + li * 0.22) + time * (0.004 + li * 0.006);
    float spread = 2.2 + li * 0.9;
    float xBase  = fract(hs1 + scroll) * spread - spread * 0.5;
    /* every shape stands ON the horizon (they used to float up to 0.13 above it) */
    float yBase  = HORIZON_VIS - 0.004 + hs2 * 0.006;
    float size   = (0.055 + li * 0.025) * (0.7 + hs3 * 0.7) * 0.75;
    vec2 local = vec2(p.x - xBase, p.y - yBase);
    float d;
    vec3  shapeCol;
    if (tid == 0) {
      d = sdBox(local - vec2(0.0, size * (0.6 + li * 0.3)),
                vec2(size * (0.25 + li * 0.15), size * (0.6 + li * 0.4)));
      shapeCol = vec3(0.05, 0.04, 0.14) + vec3(0.03, 0.01, 0.04) * li;
    } else if (tid == 1) {
      float dTrunk = sdBox(local - vec2(0.0, size * (0.35 + li * 0.2)),
                           vec2(size * 0.05, size * (0.5 + li * 0.25)));
      float dFrond = sdTriangle(local - vec2(0.0, size * (0.85 + li * 0.4)),
                                vec2(0.0, size * 0.30),
                                vec2(-size * (0.6 + li * 0.2), -size * 0.05),
                                vec2( size * (0.6 + li * 0.2), -size * 0.05));
      d = min(dTrunk, dFrond);
      shapeCol = vec3(0.03, 0.10 + li * 0.02, 0.06);
    } else if (tid == 2) {
      d = sdTriangle(local - vec2(0.0, size * (0.4 + li * 0.2)),
                     vec2(0.0, size * (0.5 + li * 0.3)),
                     vec2(-size * (0.5 + li * 0.2), -size * (0.4 + li * 0.1)),
                     vec2( size * (0.5 + li * 0.2), -size * (0.4 + li * 0.1)));
      shapeCol = vec3(0.11, 0.03, 0.03) + vec3(0.02, 0.01, 0.01) * li;
    } else if (tid == 3) {
      d = abs(local.x) * (1.3 - li * 0.15)
        + abs(local.y - size * (0.8 + li * 0.3)) - size * (0.9 + li * 0.3);
      shapeCol = vec3(0.72, 0.85, 0.95) + vec3(0.05) * li;
    } else if (tid == 4) {
      d = sdTriangle(local - vec2(0.0, size * (0.35 + li * 0.15)),
                     vec2(0.0, size * (0.4 + li * 0.2)),
                     vec2(-size * (0.9 + li * 0.3), 0.0),
                     vec2( size * (0.9 + li * 0.3), 0.0));
      shapeCol = vec3(0.18 + li * 0.02, 0.05, 0.11 + li * 0.02);
    } else {
      d = sdTriangle(local - vec2(0.0, size * (0.4 + li * 0.2)),
                     vec2(0.0, size * (0.45 + li * 0.25)),
                     vec2(-size * (0.6 + li * 0.15), -size * (0.25 + li * 0.1)),
                     vec2( size * (0.6 + li * 0.15), -size * (0.25 + li * 0.1)));
      shapeCol = vec3(0.04, 0.11 + li * 0.02, 0.04);
    }
    float layerAlpha = 0.65 + li * 0.12;
    float haze       = 1.0 - smoothstep(0.0, 0.18, abs(p.y - HORIZON_VIS) - li * 0.06);
    float body    = 1.0 - smoothstep(-0.002, 0.002, d);
    float outline = exp(-abs(d) * 200.0);
    col = mix(col, mix(shapeCol, shapeCol * 0.4, haze), body * layerAlpha);
    col += accent * outline * (0.25 + li * 0.10);
  }
  if (tid == 5) {
    float flash = step(0.98, fract(time * 0.42));
    col += vec3(0.40, 0.90, 0.15) * flash * 0.20;
  }
  return col;
}

vec3 skyDressing(vec3 col, vec2 p, float time, float speedN, vec3 accent) {
  if (p.y > HORIZON_VIS + 0.06) {
    vec2 sc = floor(p * 220.0);
    float sh = hash11(sc.x * 12.9898 + sc.y * 78.233);
    float star = step(0.9965, sh);
    float twinkle = 0.55 + 0.45 * sin(time * 3.5 + sh * 137.0);
    float starFade = smoothstep(HORIZON_VIS + 0.06, HORIZON_VIS + 0.28, p.y);
    col += vec3(0.90, 0.95, 1.00) * star * twinkle * starFade * 0.9;
  }
  vec2  sunPos = vec2(0.0, HORIZON_VIS + 0.24);
  float sunR   = 0.075;
  float dSun   = length(p - sunPos) - sunR;
  col = mix(col, mix(accent, vec3(1.0), 0.35), 1.0 - smoothstep(-0.003, 0.003, dSun));
  float hGlow = exp(-abs(p.y - HORIZON_VIS) * 42.0);
  col += accent * hGlow * 0.30;
  if (speedN > 0.35) {
    vec2  vp  = vec2(0.0, HORIZON_VIS + 0.02);
    vec2  rel = p - vp;
    float r   = length(rel);
    float ang = atan(rel.y, rel.x);
    float bands = sin(ang * 34.0 + time * 0.4);
    float line  = pow(max(bands, 0.0), 10.0);
    float rFade = smoothstep(0.15, 0.65, r) * (1.0 - smoothstep(0.85, 1.3, r));
    float aLine = line * rFade * (speedN - 0.35) / 0.65;
    col += mix(vec3(1.0), accent, 0.4) * aLine * 0.55;
  }
  return col;
}

/* ------------------------------------------------------------------ */
/* SKATER — Skater Boy character from the reference                    */
/* ------------------------------------------------------------------ */
vec3 drawSkater(vec3 col, vec2 skp, float s, float aa) {
  vec3 capCol   = vec3(0.90, 0.12, 0.15);
  vec3 skinCol  = vec3(1.00, 0.83, 0.68);
  vec3 shirtCol = vec3(0.20, 0.80, 0.30);
  vec3 shirtDk  = vec3(0.13, 0.55, 0.20);
  vec3 pantsCol = vec3(0.10, 0.10, 0.15);
  vec3 shoeCol  = vec3(0.95, 0.95, 0.95);
  vec3 laceCol  = vec3(1.00, 0.45, 0.10);
  vec3 boardCol = vec3(0.55, 0.32, 0.15);
  vec3 wheelCol = vec3(0.90, 0.90, 0.95);

  /* Slide: squash vertically */
  float sq = uSkater.z > 0.5 ? 0.62 : 1.0;
  skp.y /= sq;

  /* Jump lift */
  skp.y -= uSkater.y * 0.70;

  /* Lean into the lane (subtle body offset) */
  float lean = -uSkater.x * s * 0.35;

  /* === Skateboard === */
  float ba = -uSkater.x * 0.18;
  vec2 boardLocal = rot2(skp - vec2(0.0, -s * 0.60), ba);
  float dBoard = sdBox(boardLocal, vec2(s * 1.60, s * 0.075));
  col = mix(col, boardCol, 1.0 - smoothstep(-aa, aa, dBoard));
  /* Deck outline */
  float dBoardEdge = abs(dBoard + s * 0.018) - s * 0.014;
  col = mix(col, boardCol * 0.4, 1.0 - smoothstep(-aa, aa, dBoardEdge));
  /* Trucks + wheels */
  vec2 wL = skp - vec2(-s * 1.05, -s * 0.72);
  vec2 wR = skp - vec2( s * 1.05, -s * 0.72);
  float wR2 = s * 0.14;
  col = mix(col, wheelCol, 1.0 - smoothstep(-aa, aa, length(wL) - wR2));
  col = mix(col, wheelCol, 1.0 - smoothstep(-aa, aa, length(wR) - wR2));
  col = mix(col, vec3(0.15), 1.0 - smoothstep(-aa, aa, length(wL) - wR2 * 0.4));
  col = mix(col, vec3(0.15), 1.0 - smoothstep(-aa, aa, length(wR) - wR2 * 0.4));

  /* === Legs (black pants) === */
  float dLegs = sdBox(skp - vec2(lean * 0.5, -s * 0.18), vec2(s * 0.22, s * 0.28));
  col = mix(col, pantsCol, 1.0 - smoothstep(-aa, aa, dLegs));

  /* === Torso (green shirt) === */
  float dTorso = sdBox(skp - vec2(lean, s * 0.22), vec2(s * 0.30, s * 0.24));
  col = mix(col, shirtCol, 1.0 - smoothstep(-aa, aa, dTorso));
  /* Shirt stripes */
  for (int k = 0; k < 3; k++) {
    float stripeY = s * 0.10 + float(k) * s * 0.12;
    float dStripe = sdBox(skp - vec2(lean, stripeY), vec2(s * 0.31, s * 0.018));
    col = mix(col, shirtDk, 0.85 * (1.0 - smoothstep(-aa, aa, dStripe)));
  }

  /* === Head === */
  vec2 headPos = vec2(lean, s * 0.62);
  float dHead = length(skp - headPos) - s * 0.19;
  col = mix(col, skinCol, 1.0 - smoothstep(-aa, aa, dHead));

  /* === Red cap (backwards) === */
  vec2 capPos = vec2(lean, s * 0.74);
  float dCap = length(skp - capPos) - s * 0.20;
  col = mix(col, capCol, 1.0 - smoothstep(-aa, aa, dCap));
  /* Brim (points back) */
  float dBrim = sdBox(skp - vec2(lean, s * 0.60), vec2(s * 0.28, s * 0.035));
  col = mix(col, capCol * 0.75, 1.0 - smoothstep(-aa, aa, dBrim));
  /* Puff / tassel */
  float dPuff = length(skp - vec2(lean + s * 0.16, s * 0.94)) - s * 0.06;
  col = mix(col, capCol, 1.0 - smoothstep(-aa, aa, dPuff));
  col += capCol * exp(-max(dPuff, 0.0) * 100.0) * 0.4;

  /* === Face === */
  /* Angry eyebrows */
  float dBrwL = sdBox(rot2(skp - vec2(lean - s * 0.07, s * 0.72), 0.35), vec2(s * 0.06, s * 0.012));
  float dBrwR = sdBox(rot2(skp - vec2(lean + s * 0.07, s * 0.72), -0.35), vec2(s * 0.06, s * 0.012));
  col = mix(col, vec3(0.05), 0.95 * (1.0 - smoothstep(-aa, aa, min(dBrwL, dBrwR))));
  /* Eyes */
  float dEyeL = length(skp - vec2(lean - s * 0.07, s * 0.66)) - s * 0.022;
  float dEyeR = length(skp - vec2(lean + s * 0.07, s * 0.66)) - s * 0.022;
  col = mix(col, vec3(0.05), 1.0 - smoothstep(-aa, aa, min(dEyeL, dEyeR)));
  /* Big white grin */
  float dGrin = sdBox(skp - vec2(lean, s * 0.52), vec2(s * 0.13, s * 0.035));
  col = mix(col, vec3(1.0), 1.0 - smoothstep(-aa, aa, dGrin));
  /* Teeth lines */
  for (int t = 0; t < 3; t++) {
    float tx = lean - s * 0.06 + float(t) * s * 0.06;
    float dTooth = sdBox(skp - vec2(tx, s * 0.52), vec2(s * 0.008, s * 0.034));
    col = mix(col, vec3(0.15), 1.0 - smoothstep(-aa, aa, dTooth));
  }

  /* === Arms (one up, one out) === */
  vec2 armL = skp - vec2(lean - s * 0.38, s * 0.42);
  vec2 armR = skp - vec2(lean + s * 0.42, s * 0.05);
  float dArmL = sdBox(armL, vec2(s * 0.16, s * 0.06));
  float dArmR = sdBox(armR, vec2(s * 0.16, s * 0.06));
  col = mix(col, skinCol, 1.0 - smoothstep(-aa, aa, dArmL));
  col = mix(col, skinCol, 1.0 - smoothstep(-aa, aa, dArmR));
  /* Sleeve caps */
  col = mix(col, shirtCol, 1.0 - smoothstep(-aa, aa,
    length(skp - vec2(lean - s * 0.24, s * 0.35)) - s * 0.09));
  col = mix(col, shirtCol, 1.0 - smoothstep(-aa, aa,
    length(skp - vec2(lean + s * 0.30, s * 0.18)) - s * 0.09));

  /* === Sneakers === */
  float dShoeL = sdBox(skp - vec2(lean - s * 0.22, -s * 0.44), vec2(s * 0.17, s * 0.075));
  float dShoeR = sdBox(skp - vec2(lean + s * 0.22, -s * 0.44), vec2(s * 0.17, s * 0.075));
  col = mix(col, shoeCol, 1.0 - smoothstep(-aa, aa, dShoeL));
  col = mix(col, shoeCol, 1.0 - smoothstep(-aa, aa, dShoeR));
  /* Bright orange laces */
  col += laceCol * (1.0 - smoothstep(0.0, s * 0.045,
    length(skp - vec2(lean - s * 0.22, -s * 0.44)))) * 0.95;
  col += laceCol * (1.0 - smoothstep(0.0, s * 0.045,
    length(skp - vec2(lean + s * 0.22, -s * 0.44)))) * 0.95;
  /* Shoe outline */
  float dShoeOutline = abs(min(dShoeL, dShoeR) + s * 0.010) - s * 0.008;
  col = mix(col, vec3(0.35), 0.7 * (1.0 - smoothstep(-aa, aa, dShoeOutline)));

  return col;
}

void main() {
  vec2 fc = gl_FragCoord.xy;
  vec2 uv = fc / iResolution.xy;
  vec2 p  = (fc - 0.5 * iResolution.xy) / iResolution.y + uShake;
  float aa = 1.5 / iResolution.y;

  int  tid    = int(hash11(uSeed) * 6.0) % 6;
  vec3 skyTop = PAL[tid * 5 + 0];
  vec3 skyBot = PAL[tid * 5 + 1];
  vec3 trackC = PAL[tid * 5 + 2];
  vec3 offC   = PAL[tid * 5 + 3];
  vec3 accent = PAL[tid * 5 + 4];

  float skyH = clamp((p.y - HORIZON_VIS) / (0.5 - HORIZON_VIS), 0.0, 1.0);
  vec3 col = mix(skyBot, skyTop, pow(skyH, 0.85));

  float speedN = clamp(uSpeed, 0.0, 1.0);
  col = skyDressing(col, p, iTime, speedN, accent);
  col = addScenery(col, p, iTime, tid, uSeed, accent, 0.0);

  /* -------- Ground: scrolling endless road -------- */
  float t = (p.y - KART_POS.y) / (HORIZON_Y - KART_POS.y);
  if (t < 0.94) {
    float inv = 1.0 - t;
    if (inv > 0.10) {
      float denom = min(1.0 / inv, 14.0);
      float fwd   = (denom - 1.0) / COMPRESSION;
      float laneX = p.x / inv;
      vec2 worldPos = vec2(laneX, fwd + uDistance);
      float aaWorld = 1.5 * denom / iResolution.y;

      vec3 ground = voidColor(worldPos * 0.35, iTime, tid, offC, trackC, accent);

      /* Road tint — darker central band */
      float roadMask = 1.0 - smoothstep(0.42, 0.48, abs(laneX));
      ground = mix(ground, ground * 0.55, roadMask * 0.6);

      /* Lane dividers (dashed) */
      float lane1 = abs(laneX - 0.15);
      float lane2 = abs(laneX + 0.15);
      float laneW = 0.010 + aaWorld * 2.0;
      float laneMask = max(1.0 - smoothstep(laneW * 0.5, laneW, lane1),
                           1.0 - smoothstep(laneW * 0.5, laneW, lane2));
      float dash = step(0.45, fract(worldPos.y * 1.2));
      ground = mix(ground, accent * 0.85, laneMask * dash * 0.85);

      /* Road edges */
      float edge1 = abs(laneX - 0.45);
      float edge2 = abs(laneX + 0.45);
      float edgeMask = max(1.0 - smoothstep(laneW * 0.5, laneW, edge1),
                           1.0 - smoothstep(laneW * 0.5, laneW, edge2));
      ground = mix(ground, accent, edgeMask * 0.95);

      /* Distance fog */
      float fog = smoothstep(3.0, 10.0, denom);
      ground = mix(ground, skyBot, fog);

      col = ground;
    }
  }

  /* -------- Obstacles -------- */
  /* Each object is drawn in "object space": q = (p - groundPoint) / persp, so one unit of q is one
     screen unit at the skater's depth. A lane is LANE_X (0.30) wide there and every obstacle uses
     0.25 of it (HW = 0.125 each side), so it fills the lane it was given and nothing else. */
  for (int j = 0; j < 16; j++) {
    int i = 15 - j;                       /* arrays are nearest-first: walk backwards, near ends up on top */
    if (i < uObstacleCount) {
      vec4 ob = uObstacles[i];
      if (ob.w < 0.5) continue;
      float dist = ob.y;
      if (dist < -0.4 || dist > 30.0) continue;

      float persp = 1.0 / (1.0 + dist * COMPRESSION);
      vec2  base  = vec2(ob.x * LANE_X * persp,
                         KART_POS.y + (1.0 - persp) * (HORIZON_Y - KART_POS.y));
      vec2  q     = (p - base) / persp;
      if (abs(q.x) > 0.30 || q.y < -0.04 || q.y > 0.17) continue;   /* cheap reject */

      float aq     = aa / max(persp, 0.12);
      float HW     = 0.125;
      float lampOn = step(0.0, sin(iTime * 7.0 + ob.x * 2.0 + dist * 0.3));
      float onSide = q.x < 0.0 ? lampOn : 1.0 - lampOn;     /* lamps alternate left / right */
      vec3  prevCol = col;

      /* contact shadow on the road */
      vec2 shq = q / vec2(HW * 1.15, 0.014);
      col = mix(col, vec3(0.0), 0.45 * (1.0 - smoothstep(0.5, 1.0, length(shq))));

      if (ob.z < 0.5) {
        /* ---- Road barrier (JUMP): striped board on two legs with amber lamps ---- */
        float dLegs = min(sdBox(q - vec2(-0.088, 0.016), vec2(0.011, 0.016)),
                          sdBox(q - vec2( 0.088, 0.016), vec2(0.011, 0.016)));
        col = mix(col, vec3(0.16, 0.17, 0.22), 1.0 - smoothstep(-aq, aq, dLegs));
        float dFoot = min(sdBox(q - vec2(-0.088, 0.003), vec2(0.028, 0.003)),
                          sdBox(q - vec2( 0.088, 0.003), vec2(0.028, 0.003)));
        col = mix(col, vec3(0.07, 0.07, 0.10), 1.0 - smoothstep(-aq, aq, dFoot));

        float dBoard = sdBox(q - vec2(0.0, 0.047), vec2(HW, 0.021));
        float stripe = step(0.5, fract((q.x + q.y) / 0.050));
        vec3  bCol   = mix(vec3(1.00, 0.50, 0.08), vec3(0.96, 0.96, 0.98), stripe);
        bCol *= 0.70 + 0.55 * smoothstep(0.026, 0.068, q.y);            /* lit from above */
        col = mix(col, bCol, 1.0 - smoothstep(-aq, aq, dBoard));
        float rimB = 1.0 - smoothstep(-aq, aq, abs(dBoard + 0.003) - 0.0025);
        col = mix(col, vec3(0.22, 0.11, 0.03), 0.85 * rimB);

        float dLamp = length(vec2(abs(q.x) - 0.108, q.y - 0.077)) - 0.0095;
        col = mix(col, mix(vec3(0.30, 0.16, 0.03), vec3(1.0, 0.82, 0.25), onSide),
                  1.0 - smoothstep(-aq, aq, dLamp));
        col += vec3(1.0, 0.65, 0.10) * exp(-max(dLamp, 0.0) * 60.0) * 0.55 * onSide;
      } else {
        /* ---- Overhead gantry (SLIDE): two posts and a hazard beam at head height ---- */
        float dPost = min(sdBox(q - vec2(-0.118, 0.045), vec2(0.0085, 0.045)),
                          sdBox(q - vec2( 0.118, 0.045), vec2(0.0085, 0.045)));
        col = mix(col, vec3(0.14, 0.15, 0.21), 1.0 - smoothstep(-aq, aq, dPost));
        col = mix(col, vec3(0.34, 0.36, 0.48), 0.9 * (1.0 - smoothstep(-aq, aq, sdBox(q - vec2(-0.1205, 0.045), vec2(0.0022, 0.043)))));
        col = mix(col, vec3(0.34, 0.36, 0.48), 0.9 * (1.0 - smoothstep(-aq, aq, sdBox(q - vec2( 0.1155, 0.045), vec2(0.0022, 0.043)))));

        float dBeam  = sdBox(q - vec2(0.0, 0.056), vec2(HW, 0.0135));
        float stripe = step(0.5, fract((q.x - q.y) / 0.050));
        vec3  bCol   = mix(vec3(0.92, 0.10, 0.16), vec3(0.96), stripe);
        bCol *= 0.70 + 0.55 * smoothstep(0.0425, 0.0695, q.y);
        col = mix(col, bCol, 1.0 - smoothstep(-aq, aq, dBeam));
        float rimG = 1.0 - smoothstep(-aq, aq, abs(dBeam + 0.003) - 0.0025);
        col = mix(col, vec3(0.20, 0.03, 0.05), 0.85 * rimG);

        /* neon emitter strip under the beam, spilling light onto the road */
        float dEm = sdBox(q - vec2(0.0, 0.0405), vec2(0.108, 0.0022));
        col += vec3(0.62, 0.15, 1.00) * (1.0 - smoothstep(-aq, aq, dEm)) * 0.9;
        col += vec3(0.62, 0.15, 1.00) * exp(-max(dEm, 0.0) * 70.0) * 0.30;

        float dBeacon = length(vec2(abs(q.x) - 0.118, q.y - 0.096)) - 0.0105;
        col = mix(col, mix(vec3(0.30, 0.03, 0.05), vec3(1.0, 0.18, 0.22), onSide),
                  1.0 - smoothstep(-aq, aq, dBeacon));
        col += vec3(1.0, 0.15, 0.20) * exp(-max(dBeacon, 0.0) * 60.0) * 0.55 * onSide;
      }

      /* haze with distance + fade in from the fog instead of popping in */
      float visO = (1.0 - 0.6 * smoothstep(3.0, 10.0, 1.0 / persp)) * (1.0 - smoothstep(18.0, 27.0, dist));
      col = prevCol + (col - prevCol) * visO;
    }
  }

  /* -------- Coins -------- */
  for (int j = 0; j < 32; j++) {
    int i = 31 - j;
    if (i < uCoinCount) {
      vec4  cn   = uCoins[i];
      float dist = cn.y;
      if (dist < -0.4 || dist > 30.0) continue;

      float persp = 1.0 / (1.0 + dist * COMPRESSION);
      vec2  base  = vec2(cn.x * LANE_X * persp,
                         KART_POS.y + (1.0 - persp) * (HORIZON_Y - KART_POS.y));
      float cH    = cn.z > 0.5 ? 0.135 : 0.060;          /* raised coins hang at jump height */
      vec2  q     = (p - base) / persp;
      if (abs(q.x) > 0.09 || q.y < -0.02 || q.y > cH + 0.07) continue;

      float aq      = aa / max(persp, 0.12);
      vec3  prevCol = col;

      vec2 shq = q / vec2(0.034, 0.010);
      col = mix(col, vec3(0.0), (cn.z > 0.5 ? 0.20 : 0.38) * (1.0 - smoothstep(0.4, 1.0, length(shq))));

      float R    = 0.030;
      float spin = abs(cos(iTime * 4.5 + cn.w * 6.283));            /* edge-on <-> face-on */
      vec2  e    = (q - vec2(0.0, cH)) / vec2(max(spin, 0.20) * R, R);
      float rr   = length(e);
      float aaE  = aq / R;
      float body = 1.0 - smoothstep(1.0 - aaE, 1.0 + aaE, rr);

      vec3  gold = mix(vec3(1.00, 0.86, 0.28), vec3(1.00, 0.60, 0.08), clamp(0.5 - 0.5 * e.y + 0.25 * e.x, 0.0, 1.0));
      float face = smoothstep(0.35, 0.80, spin);
      vec3  cc   = mix(gold, vec3(0.78, 0.46, 0.05), smoothstep(0.74, 0.88, rr));        /* darker rim */
      cc = mix(cc, vec3(1.0, 0.95, 0.65), exp(-abs(rr - 0.60) * 28.0) * 0.55 * face);    /* engraved ring */
      float mark = (1.0 - smoothstep(0.0, 0.11, abs(e.x))) * (1.0 - smoothstep(0.30, 0.38, abs(e.y)));
      cc = mix(cc, vec3(0.85, 0.52, 0.06), mark * 0.8 * face);                           /* centre mark */
      float gl  = (e.x + e.y * 0.7) - (fract(iTime * 0.9 + cn.w) * 3.0 - 1.5);
      cc += vec3(1.0, 0.98, 0.80) * exp(-gl * gl * 10.0) * 0.5;                          /* glint sweep */

      col = mix(col, cc, body);
      col += vec3(1.0, 0.72, 0.18) * exp(-max(rr - 1.0, 0.0) * 2.2) * 0.22;

      float visC = (1.0 - 0.6 * smoothstep(3.0, 10.0, 1.0 / persp)) * (1.0 - smoothstep(18.0, 27.0, dist));
      col = prevCol + (col - prevCol) * visC;
    }
  }

  /* -------- The Dark: whatever is chasing you, rising from the bottom of the screen -------- */
  if (uThreat > 0.02) {
    float th   = uThreat;
    float cxD  = uSkater.x * LANE_X * 0.45;                       /* it leans toward your lane */
    float topY = -0.58 + th * 0.42;                               /* off-screen ... over the skater */
    if (p.y < topY + 0.22) {
      float wob = 0.020 * sin(p.x * 17.0 + iTime * 2.3)
                + 0.012 * sin(p.x * 41.0 - iTime * 3.7)
                + 0.008 * sin(p.x * 83.0 + iTime * 6.1);
      float dMass = p.y - (topY + wob);
      float dClaw = 1e3;
      for (int k = -3; k <= 3; k++) {
        float fk  = float(k);
        float chH = 0.050 + 0.060 * abs(sin(fk * 2.1 + iTime * 1.3)) * (0.4 + th);
        vec2  cl  = p - vec2(cxD + fk * 0.12 + 0.012 * sin(iTime * 2.0 + fk), topY + wob * 0.6);
        dClaw = min(dClaw, sdTriangle(cl, vec2(0.0, chH), vec2(-0.032, -0.01), vec2(0.032, -0.01)));
      }
      float dD   = min(dMass, dClaw);
      float body = 1.0 - smoothstep(-0.004, 0.004, dD);
      col *= 1.0 - 0.55 * th * exp(-max(dD, 0.0) * 9.0);          /* smoke thrown ahead of it */
      col  = mix(col, vec3(0.015, 0.0, 0.03), body);
      col += vec3(0.85, 0.05, 0.14) * exp(-abs(dD) * 70.0) * (0.25 + 0.55 * th);   /* red rim light */

      /* eyes: two slanted slits that open up as it gets closer, with the odd blink */
      float eyeA = smoothstep(0.10, 0.30, th) * (1.0 - step(0.975, fract(iTime * 0.37)));
      float eyeY = topY - 0.06 - 0.03 * th;
      float eyeW = 0.030 + 0.022 * th;
      float eyeH = 0.009 + 0.008 * th;
      for (int s2 = 0; s2 < 2; s2++) {
        float sg = s2 == 0 ? -1.0 : 1.0;
        vec2  ep = rot2(p - vec2(cxD + sg * (0.075 + 0.022 * th), eyeY), sg * 0.40);
        float le = length(ep / vec2(eyeW, eyeH));
        col += vec3(1.0, 0.12, 0.08) * (1.0 - smoothstep(0.85, 1.0, le)) * eyeA;
        col += vec3(1.0, 0.85, 0.65) * (1.0 - smoothstep(0.0, 0.45, le)) * eyeA;
        col += vec3(1.0, 0.10, 0.05) * exp(-max(le - 1.0, 0.0) * 2.5) * 0.35 * eyeA * (0.7 + 0.3 * uBeat);
      }

      /* teeth show up when it is nearly on you */
      float mouthA  = smoothstep(0.55, 0.80, th);
      float mouthY  = eyeY - 0.075;
      float zig     = abs(fract((p.x - cxD) * 13.0) - 0.5) * 2.0;
      float inMouth = step(abs(p.x - cxD), 0.15) * step(mouthY, p.y) * step(p.y, mouthY + 0.034 * (1.0 - zig));
      col = mix(col, vec3(0.93, 0.88, 0.80), inMouth * mouthA * body);
    }
  }

  /* -------- Skater shadow + skater (drawn last, on top) -------- */
  vec2 shadowPos = KART_POS + vec2(uSkater.x * LANE_X, 0.0);
  float shadowScale = 1.0 - uSkater.y * 0.6;
  col = applyShadow(col, p, shadowPos, SKATER_S * 1.1 * shadowScale);

  vec2 skp = p - KART_POS - vec2(uSkater.x * LANE_X, 0.0);
  if (!(uBlink > 0.5 && fract(iTime * 9.0) < 0.5)) {      /* blinks while invulnerable after a stumble */
    col = drawSkater(col, skp, SKATER_S, aa);
  }

  /* coin pickup burst: a gold ring expanding around the skater */
  if (uPop > 0.001) {
    float rr  = length(skp - vec2(0.0, 0.03 + uSkater.y * 0.70));
    float rad = 0.05 + (1.0 - uPop) * 0.14;
    col += vec3(1.0, 0.80, 0.25) * exp(-abs(rr - rad) * 70.0) * uPop * 0.8;
  }

  /* Vignette + scanlines */
  vec2 vuv = gl_FragCoord.xy / iResolution.xy;
  float vig = 1.0 - smoothstep(0.55, 1.05, length(vuv - 0.5) * 1.55);
  col *= mix(0.55, 1.0, vig);

  /* dread: blood-dark edges that throb with the heartbeat; the world drains of colour the deeper you run */
  float dr    = clamp(uThreat, 0.0, 1.0);
  float edgeD = smoothstep(0.20, 0.95, length(vuv - 0.5) * 1.6);
  col = mix(col, col * 0.30 + vec3(0.30, 0.0, 0.04), edgeD * dr * (0.50 + 0.50 * uBeat));
  col *= 1.0 - 0.26 * uDark;
  col  = mix(col, vec3(dot(col, vec3(0.30, 0.59, 0.11))), 0.30 * uDark);
  col  = mix(col, vec3(0.90, 0.02, 0.06), uHurt * 0.28);
  float scan = 0.97 + 0.03 * sin(gl_FragCoord.y * 1.6);
  col *= scan;

  fragColor = vec4(col, 1.0);
}`;

/* ------------------------------------------------------------------ */
/* WebGL setup                                                         */
/* ------------------------------------------------------------------ */
const canvas = document.getElementById('gl');
const gl = canvas.getContext('webgl2', { antialias: false, alpha: false });
if (!gl) throw new Error('WebGL2 required');

function compile(type, src) {
  const sh = gl.createShader(type);
  gl.shaderSource(sh, src);
  gl.compileShader(sh);
  if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(sh));
  return sh;
}

const prog = gl.createProgram();
gl.attachShader(prog, compile(gl.VERTEX_SHADER, VERT));
gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, FRAG));
gl.linkProgram(prog);
if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));
gl.useProgram(prog);

const U = n => gl.getUniformLocation(prog, n);
const uRes    = U('iResolution');
const uTime   = U('iTime');
const uSeedU  = U('uSeed');
const uSpd    = U('uSpeed');
const uDist   = U('uDistance');
const uShk    = U('uShake');
const uSktU   = U('uSkater');
const uObsC   = U('uObstacleCount');
const uObsU   = U('uObstacles');
const uCoinC  = U('uCoinCount');
const uCoinU  = U('uCoins');
const uPopU   = U('uPop');
const uThreatU = U('uThreat'), uHurtU = U('uHurt'), uBlinkU = U('uBlink'), uBeatU = U('uBeat'), uDarkU = U('uDark');

/* ------------------------------------------------------------------ */
/* Helpers                                                             */
/* ------------------------------------------------------------------ */
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const fract = x => x - Math.floor(x);

const MAX_SPEED = 1.0;
const GRAVITY   = 8.0;    // units/s^2 (the old per-frame values launched the skater ~1 screen high)
const JUMP_VEL  = 2.2;    // units/s  ->  peak ~0.30, airtime ~0.55 s
const LANE_X    = 0.30;

function hash11(n) {
  n = fract(n * 0.1031);
  n = n * (n + 33.33);
  n = n * (n + n);
  return fract(n);
}

let seed = 1.0;
window.setSeed = v => { seed = Number(v) || 0; };

/* ------------------------------------------------------------------ */
/* Game state                                                          */
/* ------------------------------------------------------------------ */
const STATE_MENU     = 'menu';
const STATE_PLAYING  = 'playing';
const STATE_GAMEOVER = 'gameover';
let state = STATE_MENU;

let currentLane = 0;       // -1..1 (glides toward targetLane)
let targetLane  = 0;
let jumpY = 0;
let jumpVel = 0;
let isSliding = false;
let coinCount = 0;
let coinFlash = 0;
let score = 0;
let distance = 0;
let speed = 0;
let obstacles = [];
let coins = [];
let obsTimer = 0;          // distance travelled since the last obstacle wave (world units)
let coinTimer = 0;         // distance travelled since the last coin line
let gameoverTime = 0;

/* ---- difficulty + dread ---- */
const LEVEL_LEN  = 250;    // metres per level
const HIT_THREAT = 0.42;   // how far a stumble lets it lunge
let level = 1, nextLevelAt = LEVEL_LEN;
let threat = 0;            // 0 = far behind you ... 1 = it has you
let threatVis = 0;         // smoothed copy that drives the visuals and sound
let invuln = 0, hurt = 0, shakeT = 0;
let beatPhase = 0, beatEnv = 0;
let best = 0;
try { best = Number(localStorage.getItem('vwSkaterBest')) || 0; } catch (e) {}
const keys = new Set();

/* 0 at the start, ~0.34 at 250 m, ~0.63 at 600 m, ~0.86 at 1200 m. Everything gets harder along this one curve. */
const diffAt      = d => 1 - Math.exp(-d / 600);
const threatFloor = diff => 0.05 + 0.12 * diff;     // it is never fully gone, and it hangs closer the further you go
const LEVEL_MSG = ['', 'RUN', 'IT STIRS', "IT'S WATCHING", "IT'S GAINING", "DON'T LOOK BACK", 'NO ESCAPE'];

const warnEl = document.getElementById('warn');
function showBanner(title, msg) {
  const el = document.getElementById('banner');
  el.querySelector('.b-lv').textContent  = title;
  el.querySelector('.b-msg').textContent = msg;
  el.classList.remove('show'); void el.offsetWidth; el.classList.add('show');
}

/* ------------------------------------------------------------------ */
/* Audio: everything is synthesised, nothing to download. M = mute.    */
/* ------------------------------------------------------------------ */
let audio = null, muted = false;
function initAudio() {
  try {
    if (!audio) {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const master = ctx.createGain();
      master.gain.value = muted ? 0 : 0.9;
      master.connect(ctx.destination);
      const drone = ctx.createGain(); drone.gain.value = 0;
      const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 140;
      const o1 = ctx.createOscillator(), o2 = ctx.createOscillator();
      o1.type = 'sawtooth'; o2.type = 'sawtooth';
      o1.frequency.value = 43; o2.frequency.value = 43.8;          // two slightly detuned saws = a slow, uneasy beat
      o1.connect(lp); o2.connect(lp); lp.connect(drone); drone.connect(master);
      o1.start(); o2.start();
      audio = { ctx, master, drone, lp };
    }
    if (audio.ctx.state === 'suspended') audio.ctx.resume();
  } catch (e) { audio = null; }
}
function tone(freq, dur, vol, type, slideTo) {
  if (!audio) return;
  const { ctx, master } = audio, t = ctx.currentTime;
  const o = ctx.createOscillator(), g = ctx.createGain();
  o.type = type || 'sine';
  o.frequency.setValueAtTime(freq, t);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol, t + 0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + 0.02);
}
function noise(dur, vol, cutoff) {
  if (!audio) return;
  const { ctx, master } = audio, t = ctx.currentTime;
  const len = Math.max(1, Math.floor(ctx.sampleRate * dur));
  const buf = ctx.createBuffer(1, len, ctx.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
  const src = ctx.createBufferSource(), f = ctx.createBiquadFilter(), g = ctx.createGain();
  src.buffer = buf; f.type = 'lowpass'; f.frequency.value = cutoff; g.gain.value = vol;
  src.connect(f); f.connect(g); g.connect(master); src.start(t);
}
const sfx = {
  coin()   { tone(988, 0.07, 0.10, 'square'); setTimeout(() => tone(1319, 0.12, 0.10, 'square'), 60); },
  hit()    { noise(0.35, 0.55, 500); tone(90, 0.30, 0.55, 'sine', 40); },
  level()  { [523, 659, 784].forEach((f, i) => setTimeout(() => tone(f, 0.18, 0.10, 'triangle'), i * 90)); },
  caught() { noise(0.9, 0.7, 700); tone(120, 1.0, 0.6, 'sawtooth', 30); },
  thump(v) { tone(68, 0.16, v, 'sine', 36); },
};
function audioTick() {                     // the drone swells and brightens with the dread
  if (!audio) return;
  const t = audio.ctx.currentTime;
  audio.drone.gain.setTargetAtTime(state === STATE_PLAYING ? 0.02 + 0.16 * threatVis : 0, t, 0.25);
  audio.lp.frequency.setTargetAtTime(120 + 380 * threatVis, t, 0.25);
}

/* ------------------------------------------------------------------ */
/* Input                                                               */
/* ------------------------------------------------------------------ */
addEventListener('keydown', e => {
  keys.add(e.code);
  if (e.code === 'KeyM') { muted = !muted; if (audio) audio.master.gain.value = muted ? 0 : 0.9; }
  /* One press = one lane hop, and you stay in the lane you chose. */
  if (!e.repeat && state === STATE_PLAYING) {
    if (e.code === 'KeyA' || e.code === 'ArrowLeft')  targetLane = clamp(targetLane - 1, -1, 1);
    if (e.code === 'KeyD' || e.code === 'ArrowRight') targetLane = clamp(targetLane + 1, -1, 1);
  }
  if ((e.code === 'KeyR' || e.code === 'Space' || e.code === 'Enter') && state !== STATE_PLAYING) {
    if (state === STATE_GAMEOVER && gameoverTime < 0.8) return;   /* don't skip the crash by accident */
    restartGame();
  }
});
addEventListener('keyup', e => keys.delete(e.code));
addEventListener('blur', () => keys.clear());   /* no stuck keys after alt-tab */

function resize() {
  const dpr = Math.min(devicePixelRatio || 1, 1.5);
  const w = Math.round(canvas.clientWidth * dpr);
  const h = Math.round(canvas.clientHeight * dpr);
  if (canvas.width !== w || canvas.height !== h) {
    canvas.width = w;
    canvas.height = h;
  }
}

/* ------------------------------------------------------------------ */
/* HUD                                                                 */
/* ------------------------------------------------------------------ */
const hud  = document.getElementById('hud');
const hctx = hud.getContext('2d');
function drawHUD() {
  hctx.clearRect(0, 0, hud.width, hud.height);
  if (state === STATE_MENU) return;

  const danger = threatVis > 0.7;
  const flash  = danger && Math.floor(performance.now() / 180) % 2 === 0;
  hctx.fillStyle = 'rgba(6, 8, 20, 0.60)';
  hctx.fillRect(0, 0, hud.width - 2, hud.height - 2);
  hctx.strokeStyle = flash ? 'rgba(255, 70, 80, 0.95)' : 'rgba(110, 220, 255, 0.70)';
  hctx.lineWidth = 2;
  hctx.strokeRect(1, 1, hud.width - 4, hud.height - 4);

  hctx.font = 'bold 24px ui-monospace, monospace';
  hctx.fillStyle = '#ffd166';
  hctx.fillText('SCORE ' + String(Math.floor(score)).padStart(6, '0'), 12, 34);

  hctx.font = 'bold 18px ui-monospace, monospace';
  hctx.fillStyle = '#7ce0ff';
  hctx.fillText('DIST ' + Math.floor(distance) + 'm', 12, 60);
  hctx.fillStyle = '#ff9db0';
  hctx.fillText('LV ' + level, 178, 60);

  /* coin counter: gold coin icon that pops on every pickup, then the count */
  const bump = 1 + 0.30 * coinFlash;
  hctx.save();
  hctx.translate(27, 88);
  hctx.scale(bump, bump);
  hctx.beginPath(); hctx.arc(0, 0, 11, 0, Math.PI * 2);
  hctx.fillStyle = '#ffd23f'; hctx.fill();
  hctx.lineWidth = 3; hctx.strokeStyle = '#c98a00'; hctx.stroke();
  hctx.beginPath(); hctx.arc(0, 0, 6.5, 0, Math.PI * 2);
  hctx.lineWidth = 1.5; hctx.strokeStyle = '#fff2a8'; hctx.stroke();
  hctx.restore();
  hctx.font = 'bold 24px ui-monospace, monospace';
  hctx.fillStyle = coinFlash > 0 ? '#fff6b0' : '#ffd166';
  hctx.fillText('x ' + coinCount, 48, 97);
  hctx.font = 'bold 13px ui-monospace, monospace';
  hctx.fillStyle = '#8fb8d8';
  hctx.fillText('BEST ' + String(best).padStart(6, '0'), 138, 94);

  /* dread meter: fills green -> amber -> red as it closes in */
  const bx = 70, by = 112, bw = 176, bh = 13;
  hctx.font = 'bold 13px ui-monospace, monospace';
  hctx.fillStyle = flash ? '#ff3344' : '#ff8a8a';
  hctx.fillText('DREAD', 12, 124);
  hctx.fillStyle = 'rgba(255, 255, 255, 0.12)';
  hctx.fillRect(bx, by, bw, bh);
  const g = hctx.createLinearGradient(bx, 0, bx + bw, 0);
  g.addColorStop(0, '#3cffb0'); g.addColorStop(0.5, '#ffd166'); g.addColorStop(1, '#ff2a3a');
  hctx.fillStyle = g;
  hctx.fillRect(bx, by, bw * Math.min(threatVis, 1), bh);
  hctx.strokeStyle = 'rgba(255, 255, 255, 0.45)'; hctx.lineWidth = 1;
  hctx.strokeRect(bx + 0.5, by + 0.5, bw - 1, bh - 1);
}

/* ------------------------------------------------------------------ */
/* Spawning                                                            */
/* ------------------------------------------------------------------ */
/* True when nothing is parked in this lane near the spawn point. */
function laneFree(lane, minDist) {
  return !obstacles.some(o => o.lane === lane && o.dist > minDist) &&
         !coins.some(c => c.h === 0 && c.lane === lane && c.dist > minDist);
}

function pickFreeLane() {
  let lane = 0;
  for (let attempt = 0; attempt < 6; attempt++) {
    lane = Math.floor(Math.random() * 3) - 1;
    if (laneFree(lane, 18)) break;
  }
  return lane;
}

/* One "wave" of obstacles. Early on it is a single barrier; the harder the run gets the more it mixes in. */
function spawnWave(diff) {
  const gantries = distance > 110;                                    /* the slide obstacle is introduced at ~110 m */
  const kind = () => (gantries && Math.random() < 0.5) ? 1 : 0;       /* 0 = barrier (jump), 1 = gantry (slide) */
  const r = Math.random();
  const busy = [-1, 0, 1].filter(l => !laneFree(l, 18));

  if (diff > 0.28 && r < 0.18 + 0.30 * diff && busy.length <= 1) {
    /* two lanes blocked, one gap; a coin trail lures you toward the safe lane */
    const open = busy.length ? busy[0] : Math.floor(Math.random() * 3) - 1;
    for (const lane of [-1, 0, 1]) {
      if (lane !== open) obstacles.push({ lane, dist: 25, type: kind() });
    }
    for (let k = 0; k < 3; k++) coins.push({ lane: open, dist: 25 + k * 1.4, h: 0, phase: k * 0.13 });
  } else if (diff > 0.5 && r > 0.80) {
    /* combo: a gantry with a barrier right behind it (slide, then jump) */
    const lane = pickFreeLane();
    obstacles.push({ lane, dist: 25,   type: 1 });
    obstacles.push({ lane, dist: 29.2, type: 0 });
  } else {
    const lane = pickFreeLane();
    const type = kind();
    obstacles.push({ lane, dist: 25, type });
    /* an arc of coins hanging over some barriers rewards the jump */
    if (type === 0 && Math.random() < 0.6) {
      for (let k = -1; k <= 1; k++) coins.push({ lane, dist: 25 + k * 1.3, h: 1, phase: Math.random() });
    }
  }
}

function spawnCoinLine() {
  let lane = Math.floor(Math.random() * 3) - 1;
  for (let attempt = 0; attempt < 6; attempt++) {
    if (laneFree(lane, 16)) break;
    lane = Math.floor(Math.random() * 3) - 1;
  }
  for (let k = 0; k < 5; k++) coins.push({ lane, dist: 26 + k * 1.5, h: 0, phase: k * 0.13 });
}

/* ------------------------------------------------------------------ */
/* Game logic                                                          */
/* ------------------------------------------------------------------ */
function restartGame() {
  initAudio();
  seed = Math.floor(Math.random() * 1000) + 1;
  currentLane = 0; targetLane = 0;
  jumpY = 0; jumpVel = 0; isSliding = false;
  coinCount = 0; coinFlash = 0;
  score = 0; distance = 0; speed = 0;
  obstacles = []; coins = [];
  obsTimer = 0; coinTimer = 0; gameoverTime = 0;
  level = 1; nextLevelAt = LEVEL_LEN;
  threat = threatFloor(0); threatVis = 0;
  invuln = 0; hurt = 0; shakeT = 0; beatPhase = 0; beatEnv = 0;
  setState(STATE_PLAYING);
  showBanner('LEVEL 1', LEVEL_MSG[1]);
}

function triggerGameOver() {
  state = STATE_GAMEOVER;
  gameoverTime = 0;
  sfx.caught();
  const sc = Math.floor(score);
  const isBest = sc > best;
  if (isBest) { best = sc; try { localStorage.setItem('vwSkaterBest', String(best)); } catch (e) {} }
  document.getElementById('final-dist').textContent =
    'IT CAUGHT YOU AT ' + Math.floor(distance) + 'm  ·  LEVEL ' + level;
  document.getElementById('final-score').textContent =
    'SCORE ' + String(sc).padStart(6, '0') + '   ·   COINS ' + coinCount +
    (isBest ? '   ·   NEW BEST!' : '   ·   BEST ' + String(best).padStart(6, '0'));
  setState(STATE_GAMEOVER);
}

/* Hitting something is no longer instant death: you stumble, lose speed, and IT lunges closer. */
function stumble() {
  threat = Math.min(1, threat + HIT_THREAT);
  speed *= 0.45;
  invuln = 1.3; hurt = 1; shakeT = 0.4;
  sfx.hit();
  if (threat >= 1) triggerGameOver();
}

function setState(newState) {
  state = newState;
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  const target = document.getElementById('screen-' + newState);
  if (target) target.classList.add('active');
  document.getElementById('ui').classList.toggle('active', newState !== STATE_PLAYING);
}

function updateGame(dt) {
  const diff = diffAt(distance);

  /* Glide to the chosen lane (frame-rate independent). */
  currentLane += (targetLane - currentLane) * (1 - Math.exp(-dt * 14));

  /* Jump: real physics in seconds, so it feels the same at any frame rate. */
  if ((keys.has('KeyW') || keys.has('ArrowUp')) && jumpY === 0 && jumpVel === 0) {
    jumpVel = JUMP_VEL;
  }
  if (jumpVel !== 0 || jumpY > 0) {
    jumpVel -= GRAVITY * dt;
    jumpY   += jumpVel * dt;
    if (jumpY <= 0) { jumpY = 0; jumpVel = 0; }
  }

  /* Slide (ground only) */
  isSliding = (keys.has('KeyS') || keys.has('ArrowDown')) && jumpY === 0;

  /* Ease up to full speed; the run keeps getting faster along the difficulty curve (up to ~2.1x). */
  speed += (MAX_SPEED - speed) * Math.min(dt * 0.8, 1);
  const pace = speed * (1.0 + 1.1 * diff);

  /* Distance + score */
  const step = pace * dt * 8;
  distance += step;
  score += step * 10;

  /* A new level every 250 m: bonus score, a breath of relief, and the banner gets more ominous. */
  if (distance >= nextLevelAt) {
    level++; nextLevelAt += LEVEL_LEN;
    score += 250 * (level - 1);
    threat = Math.max(threatFloor(diff), threat - 0.15);
    showBanner('LEVEL ' + level, LEVEL_MSG[Math.min(level, LEVEL_MSG.length - 1)]);
    sfx.level();
  }

  /* Spawning is by DISTANCE travelled, so spacing is constant in world units at any speed.
     Gaps shrink from 8.6 to 5.6 units as the curve climbs; the first obstacle comes at 35 m. */
  obsTimer  += step;
  coinTimer += step;
  const spacing = Math.max(5.6, 8.6 - 3.2 * diff);
  if (distance > 35 && obsTimer  > spacing) { obsTimer  = 0; spawnWave(diff); }
  if (distance > 12 && coinTimer > 20)      { coinTimer = 0; spawnCoinLine(); }

  /* Move everything toward the player */
  for (let i = obstacles.length - 1; i >= 0; i--) {
    obstacles[i].dist -= step;
    if (obstacles[i].dist < -1.0) obstacles.splice(i, 1);
  }
  for (let i = coins.length - 1; i >= 0; i--) {
    coins[i].dist -= step;
    if (coins[i].dist < -1.0) coins.splice(i, 1);
  }

  /* Collision: a barrier is cleared by jumping, a gantry by sliding under it. Otherwise: stumble. */
  if (invuln > 0) invuln -= dt;
  for (let i = obstacles.length - 1; i >= 0; i--) {
    const ob = obstacles[i];
    if (Math.abs(ob.dist) < 0.5 && Math.abs(ob.lane - currentLane) < 0.45) {
      const avoided = ob.type === 0 ? jumpY > 0.15 : isSliding;
      if (!avoided && invuln <= 0) {
        obstacles.splice(i, 1);                 /* you smash through it */
        stumble();
        if (state === STATE_GAMEOVER) return;
      }
    }
  }

  /* Coins: ground coins need you low, raised coins need you in the air. Each one pushes IT back a little. */
  for (let i = coins.length - 1; i >= 0; i--) {
    const c = coins[i];
    if (Math.abs(c.dist) < 0.6 && Math.abs(c.lane - currentLane) < 0.55) {
      const reachable = c.h ? jumpY > 0.09 : jumpY < 0.16;
      if (reachable) {
        coins.splice(i, 1); coinCount++; score += 25; coinFlash = 1.0;
        threat -= 0.03;
        sfx.coin();
      }
    }
  }

  /* The Dark: backs off while you run clean (more slowly the deeper you are), gains when you slow down. */
  threat -= (0.045 - 0.020 * diff) * dt;
  if (speed < MAX_SPEED * 0.6) threat += 0.07 * dt;
  threat = clamp(threat, threatFloor(diff), 1.0);
  if (threat >= 1.0) { triggerGameOver(); return; }

  coinFlash = Math.max(0, coinFlash - dt * 3.0);
  hurt      = Math.max(0, hurt - dt * 2.2);
  shakeT    = Math.max(0, shakeT - dt);

  /* heartbeat: 54 bpm when it is far, ~156 bpm when it is on top of you */
  const bps    = 0.9 + 1.7 * threatVis;
  const prevPh = beatPhase % 1;
  beatPhase   += dt * bps;
  const ph     = beatPhase % 1;
  if (prevPh > ph) { if (threatVis > 0.12) sfx.thump(0.10 + 0.50 * threatVis); }
  else if (prevPh < 0.30 && ph >= 0.30 && threatVis > 0.12) sfx.thump(0.07 + 0.35 * threatVis);
  beatEnv = Math.max(Math.exp(-Math.pow((ph - 0.03) / 0.06, 2)),
                     0.7 * Math.exp(-Math.pow((ph - 0.30) / 0.07, 2)));
}

/* ------------------------------------------------------------------ */
/* Uniform buffers                                                     */
/* ------------------------------------------------------------------ */
const obsBuf  = new Float32Array(16 * 4);
const coinBuf = new Float32Array(32 * 4);

function packBuffers() {
  obstacles.sort((a, b) => a.dist - b.dist);       /* nearest first, like the shader expects */
  for (let i = 0; i < 16; i++) {
    if (i < obstacles.length) {
      const ob = obstacles[i];
      obsBuf[i * 4 + 0] = ob.lane;
      obsBuf[i * 4 + 1] = ob.dist;
      obsBuf[i * 4 + 2] = ob.type;
      obsBuf[i * 4 + 3] = 1.0;
    } else {
      obsBuf[i * 4 + 3] = 0.0;
    }
  }
  coins.sort((a, b) => a.dist - b.dist);
  for (let i = 0; i < 32; i++) {
    if (i < coins.length) {
      const c = coins[i];
      coinBuf[i * 4 + 0] = c.lane;
      coinBuf[i * 4 + 1] = c.dist;
      coinBuf[i * 4 + 2] = c.h;
      coinBuf[i * 4 + 3] = c.phase;
    } else {
      coinBuf[i * 4 + 1] = 99.0;
    }
  }
}

/* ------------------------------------------------------------------ */
/* Main loop                                                           */
/* ------------------------------------------------------------------ */
const t0 = performance.now();
let last = t0;

function frame(now) {
  const dt   = Math.min((now - last) / 1000, 1 / 30);
  last = now;
  const tSec = (now - t0) / 1000;

  resize();
  gl.viewport(0, 0, canvas.width, canvas.height);

  if (state === STATE_PLAYING) {
    updateGame(dt);
  } else if (state === STATE_GAMEOVER) {
    gameoverTime += dt;
  } else {
    distance += dt * 2.0;     /* idle scroll behind the menu */
  }

  /* The Dark lunges quickly toward its target (so a hit feels like a hit) and slinks away slowly. */
  const tTarget = state === STATE_PLAYING ? threat : state === STATE_GAMEOVER ? 1.0 : 0.0;
  threatVis += (tTarget - threatVis) * (1 - Math.exp(-dt * (tTarget > threatVis ? 7 : 2.5)));
  audioTick();
  warnEl.classList.toggle('on', state === STATE_PLAYING && threatVis > 0.68);

  drawHUD();

  /* Shake: big on a stumble, a nervous tremble when it is right behind you, a jolt on game over */
  let shx = 0, shy = 0;
  if (state === STATE_GAMEOVER && gameoverTime < 0.25) {
    const k = 0.015 * (1.0 - gameoverTime / 0.25);
    shx = Math.sin(tSec * 90.0) * k;  shy = Math.cos(tSec * 120.0) * k;
  } else if (state === STATE_PLAYING) {
    const amp = 0.014 * Math.min(shakeT / 0.4, 1.0) + 0.005 * Math.max(0, threatVis - 0.75) / 0.25;
    shx = Math.sin(tSec * 70.0) * amp;  shy = Math.cos(tSec * 93.0) * amp;
  }
  gl.uniform2f(uShk, shx, shy);

  packBuffers();

  const playing = state === STATE_PLAYING;
  gl.uniform3f(uRes, canvas.width, canvas.height, 1.0);
  gl.uniform1f(uTime, tSec);
  gl.uniform1f(uSeedU, seed);
  gl.uniform1f(uSpd, speed);
  gl.uniform1f(uDist, distance);
  gl.uniform3f(uSktU, currentLane, jumpY, isSliding ? 1.0 : 0.0);
  gl.uniform1f(uPopU, coinFlash);
  gl.uniform1f(uThreatU, threatVis);
  gl.uniform1f(uHurtU, hurt);
  gl.uniform1f(uBlinkU, playing && invuln > 0 ? 1.0 : 0.0);
  gl.uniform1f(uBeatU, playing ? beatEnv : 0.0);
  gl.uniform1f(uDarkU, state === STATE_MENU ? 0.0 : diffAt(distance));
  gl.uniform1i(uObsC, Math.min(obstacles.length, 16));
  gl.uniform4fv(uObsU, obsBuf);
  gl.uniform1i(uCoinC, Math.min(coins.length, 32));
  gl.uniform4fv(uCoinU, coinBuf);
  gl.drawArrays(gl.TRIANGLES, 0, 3);

  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

/* ------------------------------------------------------------------ */
/* Buttons                                                             */
/* ------------------------------------------------------------------ */
document.getElementById('btn-play').addEventListener('click', restartGame);
document.getElementById('btn-restart').addEventListener('click', restartGame);

setState(STATE_MENU);
</script>
</body>
</html>
